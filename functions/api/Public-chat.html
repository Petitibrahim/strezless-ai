
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Business AI Assistant | STREZLESS AI</title>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .chat-container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      padding: 22px;
      background: #102238;
      border: 1px solid #35516d;
      border-radius: 14px;
    }

    h1 {
      color: #38d9c2;
      font-size: 25px;
    }

    .muted {
      color: #b5c5d5;
    }

    #chatMessages {
      min-height: 250px;
      max-height: 450px;
      overflow-y: auto;
      padding: 15px;
      margin: 20px 0;
      background: #07111f;
      border: 1px solid #35516d;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 9px;
      white-space: pre-wrap;
    }

    .user-message {
      background: #174b55;
    }

    .bot-message {
      background: #20344b;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 13px;
      color: white;
      background: #07111f;
      border: 1px solid #35516d;
      border-radius: 8px;
      font: inherit;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      color: #07111f;
      background: #38d9c2;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      color: #38d9c2;
      overflow-wrap: anywhere;
    }

    .turnstile-container {
      margin-top: 18px;
      overflow-x: auto;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      color: #9aafc4;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="chat-container">

    <h1 id="chatTitle">Business AI Assistant</h1>

    <p class="muted">
      Powered by STREZLESS AI
    </p>

    <div id="chatMessages" aria-live="polite">
      <p class="muted">
        Hello! Send a message to start your conversation.
      </p>
    </div>

    <form id="publicChatForm">

      <label for="chatInput">Your message</label>

      <textarea
        id="chatInput"
        maxlength="4000"
        placeholder="Type your question here..."
        required
      ></textarea>

      <div class="turnstile-container">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAGM1M0164QW-fsbR">
        </div>
      </div>

      <button type="submit" id="sendButton">
        Send Message
      </button>

    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      AI assistance provided by STREZLESS AI
    </footer>

  </main>

  <script>
    const businessId = new URLSearchParams(
      window.location.search
    ).get("business_id");

    const form = document.getElementById("publicChatForm");
    const input = document.getElementById("chatInput");
    const messages = document.getElementById("chatMessages");
    const status = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");

    const history = [];

    if (!businessId) {
      status.textContent =
        "This chatbot link is incomplete. Please contact the business.";
      sendButton.disabled = true;
    }

    function addMessage(role, content) {
      const element = document.createElement("div");

      element.className =
        role === "user"
          ? "message user-message"
          : "message bot-message";

      const label = document.createElement("strong");
      label.textContent =
        role === "user" ? "You: " : "Assistant: ";

      const text = document.createElement("span");
      text.textContent = content;

      element.append(label, text);
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || !businessId) return;

      const turnstileToken = form.querySelector(
        '[name="cf-turnstile-response"]'
      )?.value;

      if (!turnstileToken) {
        status.textContent =
          "Please complete the security verification.";
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      status.textContent = "Your assistant is thinking...";

      addMessage("user", message);

      const previousHistory = [...history];

      input.value = "";

      try {
        const response = await fetch("/api/public-chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            business_id: businessId,
            message,
            history: previousHistory,
            turnstile_token: turnstileToken
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Could not contact the assistant."
          );
        }

        document.getElementById("chatTitle").textContent =
          result.chatbot_name;

        addMessage("assistant", result.reply);

        history.push(
          { role: "user", content: message },
          { role: "assistant", content: result.reply }
        );

        if (history.length > 20) {
          history.splice(0, history.length - 20);
        }

        status.textContent = "";

      } catch (error) {
        input.value = message;
        status.textContent = error.message;
      } finally {
        if (window.turnstile) {
          window.turnstile.reset();
        }

        sendButton.disabled = false;
        sendButton.textContent = "Send Message";
      }
    });
  </script>

</body>
</html>
